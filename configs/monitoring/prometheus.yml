global:
  scrape_interval: 15s

scrape_configs:
  - job_name: proxmox
    static_configs:
      - targets: ["10.10.10.3:9100"]

  - job_name: vms
    static_configs:
      - targets: ["10.10.20.10:9100"]
        labels:
          name: test-infra
      - targets: ["10.10.30.10:9100"]
        labels:
          name: dmz

  - job_name: pfsense
    static_configs:
      - targets: ["10.10.40.1:9100"]
        labels:
          name: pfsense
