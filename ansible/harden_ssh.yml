---
- name: Harden SSH (key-only login)
  hosts: linux
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Install hardening drop-in (validated before it is written)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (harden_ssh.yml)
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    - name: Apply the change now, before the connectivity check
      ansible.builtin.meta: flush_handlers

    - name: Check that key-based login still works on this host
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 30

    - name: Read the effective sshd settings
      ansible.builtin.command: /usr/sbin/sshd -T
      register: sshd_effective
      changed_when: false
      check_mode: false

    - name: Confirm password login is off
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_effective.stdout_lines"
        success_msg: "{{ inventory_hostname }}: PasswordAuthentication no"
        fail_msg: "{{ inventory_hostname }}: password login is still enabled"

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded
